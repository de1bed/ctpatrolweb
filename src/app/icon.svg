<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CTPatrol">
  <title>CTPatrol</title>
  <!-- Escudo: la inspección es un control de seguridad. Silueta simple para
       que se distinga a 32px en una pantalla de inicio llena de íconos. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g)"/>
  <path d="M256 104 386 156v106c0 84-55 130-130 154-75-24-130-70-130-154V156z"
        fill="none" stroke="#ffffff" stroke-width="30"
        stroke-linejoin="round"/>
  <path d="M199 264l40 42 78-86"
        fill="none" stroke="#ffffff" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
